<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RF=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}),fmt=c=>RF.format(c/100),pc=v=>v==null?'—':v.toFixed(1).replace('.',',')+'%';
const rnd=x=>{const r=Math.round(Number(Math.abs(x).toFixed(6)));return x<0?-r:r};
const toC=s=>{s=String(s).trim();if(s==='')return NaN;const n=Number(s.includes(',')?s.replace(/\./g,'').replace(',','.'):s);return isFinite(n)?rnd(n*100):NaN};
const mv=v=>{v=String(v||'').trim();if(v==='')return 0;const c=toC(v);if(isNaN(c)||c<0)throw Error('Valor monetário inválido');return c};

const fd=d=>new Date(d).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}),dk=d=>new Date(d).toLocaleDateString('sv');
const K='nexo.v1';
/*CLOUD*/
const CFG={url:'https://isrttjunbsvqxaviztfi.supabase.co/rest/v1/',key:'sb_publishable_DA_I2D5udYetEo9Kve7NNA_4C5qePED'}; // PREENCHA com a URL e a chave publicável do seu projeto Supabase (veja LEIAME.md)
const sb=(CFG.url&&CFG.key&&window.supabase)?window.supabase.createClient(CFG.url,CFG.key):null;

let S=DEF(),persist=true,ver=0,uidU=null,uemail='',sync='',saving=false,pending=false,timer=0,recovery=false;
const SYL={ok:'☁ Salvo na nuvem',pend:'Salvando…',err:'⚠ Erro ao salvar'};
const setSync=x=>{sync=x;const e=$('#sy');if(e)e.textContent=SYL[x]||''};

const save=()=>{if(sb){clearTimeout(timer);setSync('pend');timer=setTimeout(push,500);return}try{localStorage.setItem(K,JSON.stringify(S))}catch(e){if(persist){persist=false;toast('Atenção: este navegador não permite salvar; os dados somem ao fechar.')}}};
async function loadCloud(){const{data,error}=await sb.from('store_data').select('data,version').eq('user_id',uidU).maybeSingle();if(error)throw error;if(data){S={...DEF(),...data.data};ver=data.version}else{S=DEF();ver=0}}
async function push(){if(!sb||!uidU)return;if(saving){pending=true;return}saving=true;setSync('pend');
try{if(ver===0){const{error}=await sb.from('store_data').insert({user_id:uidU,data:S,version:1});if(error){if(error.code==='23505')throw Error('conflict');throw error}ver=1}
else{const{data,error}=await sb.from('store_data').update({data:S,version:ver+1,updated_at:new Date().toISOString()}).eq('user_id',uidU).eq('version',ver).select('version');if(error)throw error;if(!data||!data.length)throw Error('conflict');ver++}
setSync('ok')}
catch(e){if(e.message==='conflict'){pending=false;try{await loadCloud();r();setSync('ok');toast('Outro dispositivo alterou os dados. Recarregamos a versão salva; refaça sua última ação.')}catch(x){setSync('err')}}else{setSync('err');toast('Não foi possível salvar na nuvem: '+e.message)}}
finally{saving=false;if(pending){pending=false;push()}}}
const tr=m=>/Invalid login/i.test(m)?'E-mail ou senha incorretos':/not confirmed/i.test(m)?'Confirme seu e-mail antes de entrar':/already registered/i.test(m)?'Este e-mail já tem conta':/at least/i.test(m)?'A senha precisa ter ao menos 6 caracteres':m;
const amsg=(m,ok)=>{const e=$('#au_m');if(e){e.textContent=m;e.style.color=ok?'var(--acd)':''}return 1};
function showAuth(){$('aside').style.display='none';const d=$('#dlg');if(d.open)d.close();
$('#v').innerHTML=recovery?`<div class="card" style="max-width:380px;margin:8vh auto 0"><h1>Nova senha</h1><p class="sub">Defina a nova senha da sua conta.</p><div class="f"><label for="au_p">Nova senha</label><input id="au_p" type="password" autocomplete="new-password"></div><div class="er" id="au_m" role="alert"></div><button class="b p" style="width:100%" data-a="np">Salvar nova senha</button></div>`
:`<div class="card" style="max-width:380px;margin:8vh auto 0"><h1>NEXO ERP</h1><p class="sub">Entre para acessar sua loja em qualquer dispositivo.</p><div class="f"><label for="au_e">E-mail</label><input id="au_e" type="email" autocomplete="email"></div><div class="f"><label for="au_p">Senha</label><input id="au_p" type="password" autocomplete="current-password"></div><div class="er" id="au_m" role="alert"></div><button class="b p" style="width:100%" data-a="li">Entrar</button><div class="act" style="justify-content:space-between"><button class="b s" data-a="su">Criar conta</button><button class="b s" data-a="fp">Esqueci a senha</button></div></div>`}
async function enter(ses){uidU=ses.user.id;uemail=ses.user.email||'';try{await loadCloud();sync='ok'}catch(e){showAuth();amsg('Não foi possível carregar seus dados: '+e.message);return}$('aside').style.display='';view='dash';r()}
async function boot(){if(!sb){r();return}$('#v').innerHTML='<p class="sub">Carregando…</p>';recovery=/type=recovery/.test(location.hash);
sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY')setTimeout(()=>{recovery=true;showAuth()},0);if(ev==='SIGNED_OUT')setTimeout(()=>{uidU=null;S=DEF();cart=[];ver=0;recovery=false;showAuth()},0)});
const{data:{session}}=await sb.auth.getSession();if(session&&!recovery)await enter(session);else showAuth()}
/*ENDCLOUD*/
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3200)}
/* ===== Cálculos (mesma lógica de lib/finance testada: centavos inteiros, rateio por maior resto) ===== */
function alloc(T,w){if(!T)return w.map(()=>0);const s=w.reduce((a,b)=>a+BigInt(b),0n),t=BigInt(T);const p=w.map((x,i)=>{const n=t*BigInt(x);return{i,b:n/s,r:n%s}});let l=Number(t-p.reduce((a,x)=>a+x.b,0n));const o=p.map(x=>Number(x.b));[...p].sort((a,b)=>a.r===b.r?a.i-b.i:a.r>b.r?-1:1).forEach(x=>{if(l>0){o[x.i]++;l--}});return o}
function calc(L,gd,fees,ship){const b=L.map((l,i)=>{const g=rnd(l.qty*l.price);if(l.disc>g)throw Error('Desconto do item '+(i+1)+' maior que o valor');return{g,d:l.disc,n:g-l.disc,c:rnd(l.qty*l.cost)}});
const nb=b.reduce((a,x)=>a+x.n,0);if(gd>nb)throw Error('Desconto geral maior que o total');const a=alloc(gd,b.map(x=>x.n));
const lines=b.map((x,i)=>({...x,a:a[i],net:x.n-a[i]})),net=lines.reduce((s,x)=>s+x.net,0),cogs=b.reduce((s,x)=>s+x.c,0),gp=net-cogs,np=gp-fees-ship;
return{lines,gross:b.reduce((s,x)=>s+x.g,0),net,cogs,gp,np,gm:net?gp/net*100:null,nm:net?np/net*100:null,mk:cogs?gp/cogs*100:null}}
/* ===== Estoque: toda alteração gera movimentação ===== */
const prod=id=>S.products.find(p=>p.id===id),TL={in:'Entrada',out:'Saída',loss:'Perda',sale:'Venda',reversal:'Estorno'};
function move(p,type,delta,reason,ref){const after=p.stock+delta;if(after<0)throw Error('Estoque insuficiente: '+p.name+' (saldo '+p.stock+')');S.moves.push({id:uid(),pid:p.id,type,qty:delta,before:p.stock,after,cost:p.cost,reason:reason||'',ref:ref||'',date:new Date().toISOString()});p.stock=after}
/* ===== UI ===== */
let view='dash',period=7,q='',cart=[],ckey=uid(),cf={gd:'',fees:'',ship:'',m:'pix'},pq='';
const IC={dash:'<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',prods:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',pdv:'<circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M2 3h3l3 12h11l2-8H6"/>',hist:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',stock:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',cfg:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>'};
const NAV=[['dash','Dashboard'],['prods','Produtos'],['pdv','Nova venda'],['hist','Vendas'],['stock','Estoque']];
function nav(){$('#nav').innerHTML='<div class="logo"><i></i>'+esc(S.store)+'</div>'+NAV.map(([k,l])=>`<button class="n${view===k?' on':''}" data-a="go" data-v="${k}"${view===k?' aria-current="page"':''}><svg viewBox="0 0 24 24">${IC[k]}</svg>${l}</button>`).join('')+`<button class="n hide" data-a="cfg"><svg viewBox="0 0 24 24">${IC.cfg}</svg>Configurações</button>`}
const empty=(t,m,btn)=>`<div class="empty"><b>${t}</b>${m}${btn?'<br><br>'+btn:''}</div>`;
function dash(){const live=S.sales.filter(s=>s.status==='ok'),now=new Date(),day=n=>{const a=new Date(now);a.setDate(a.getDate()-n);return dk(a)};
const from=day(period-1),pf=day(period*2-1),cur=live.filter(s=>dk(s.date)>=from),prv=live.filter(s=>dk(s.date)>=pf&&dk(s.date)<from),sm=(a,k)=>a.reduce((x,s)=>x+s[k],0);
const rev=sm(cur,'net'),prev=sm(prv,'net'),dl=prev?(rev-prev)/prev*100:null,act=S.products.filter(p=>p.active);
const sc=act.reduce((s,p)=>s+rnd(p.cost*p.stock),0),sv=act.reduce((s,p)=>s+rnd(p.price*p.stock),0),low=act.filter(p=>p.stock>0&&p.stock<=p.min),zero=act.filter(p=>p.stock<=0),below=act.filter(p=>p.price<p.cost);
const pend=sm(live,'net')-sm(live,'paid'),gp=sm(cur,'gp'),np=sm(cur,'np');
const days=[...Array(period)].map((_,i)=>{const k=day(period-1-i);return[k,sm(cur.filter(s=>dk(s.date)===k),'net')]}),mx=Math.max(1,...days.map(d=>d[1])),bw=600/period;
const svg=`<svg viewBox="0 0 600 150" width="100%" role="img" aria-label="Faturamento por dia">${days.map((d,i)=>{const h=Math.round(d[1]/mx*120);return`<rect x="${i*bw+bw*.15}" y="${130-h}" width="${bw*.7}" height="${Math.max(h,1)}" rx="3" fill="var(--ac)" opacity="${d[1]?1:.25}"><title>${d[0].split('-').reverse().join('/')}: ${fmt(d[1])}</title></rect>`}).join('')}<text x="0" y="147" font-size="11" fill="var(--mu)">${days[0][0].split('-').reverse().slice(0,2).join('/')}</text><text x="600" y="147" font-size="11" text-anchor="end" fill="var(--mu)">${days[period-1][0].split('-').reverse().slice(0,2).join('/')}</text></svg>`;
const agg={};cur.forEach(s=>s.items.forEach(i=>{const a=agg[i.pid]||(agg[i.pid]={n:i.name,q:0,p:0});a.q+=i.qty;a.p+=i.net-rnd(i.qty*i.cost)}));
const tp=Object.values(agg),byQ=[...tp].sort((a,b)=>b.q-a.q).slice(0,5),byP=[...tp].sort((a,b)=>b.p-a.p).slice(0,5);
const al=[...zero.map(p=>`<li><span class="bd x">Sem estoque</span> ${esc(p.name)}</li>`),...low.map(p=>`<li><span class="bd a">Baixo</span> ${esc(p.name)} (${p.stock}/${p.min})</li>`),...below.map(p=>`<li><span class="bd x">Preço &lt; custo</span> ${esc(p.name)}</li>`)];
const c=(k,v,x='')=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${x}</div></div>`;
return`<h1>Olá! Resumo da loja</h1><p class="sub">Últimos ${period} dias · dados reais deste navegador</p>
<div class="bar"><select id="per" style="width:auto" aria-label="Período"><option value="7"${period==7?' selected':''}>7 dias</option><option value="30"${period==30?' selected':''}>30 dias</option></select><span class="sp"></span><button class="b p" data-a="go" data-v="pdv">Nova venda</button></div>
${!S.sales.length?`<div class="card">${empty('Nenhuma venda registrada ainda','Cadastre produtos, dê entrada no estoque e registre a primeira venda.',`<button class="b" data-a="go" data-v="prods">Cadastrar produto</button> <button class="b p" data-a="go" data-v="pdv">Registrar venda</button>`)}</div>`:''}
<div class="grid">${c('Faturamento',fmt(rev),dl==null?'sem período anterior':`<span class="${dl>=0?'pos':'neg'}">${dl>=0?'▲':'▼'} ${pc(Math.abs(dl))}</span> vs. período anterior`)}${c('Vendas',cur.length)}${c('Lucro bruto',fmt(gp),'margem '+pc(rev?gp/rev*100:null))}${c('Lucro líquido est.',fmt(np),'após taxas e frete')}${c('A receber',fmt(pend))}</div>
<div class="grid">${c('Estoque a custo',fmt(sc))}${c('Estoque a preço de venda',fmt(sv))}${c('Produtos ativos',act.length)}${c('Estoque baixo / zerado',low.length+' / '+zero.length)}</div>
<div class="card" style="margin-bottom:12px"><div class="k" style="margin-bottom:6px">Faturamento por dia</div>${svg}</div>
<div class="two"><div class="card"><div class="k">Mais vendidos</div>${byQ.length?'<table>'+byQ.map(x=>`<tr><td class="w">${esc(x.n)}</td><td class="r">${x.q} un.</td></tr>`).join('')+'</table>':empty('Sem dados','')}</div>
<div class="card"><div class="k">Mais lucrativos</div>${byP.length?'<table>'+byP.map(x=>`<tr><td class="w">${esc(x.n)}</td><td class="r">${fmt(x.p)}</td></tr>`).join('')+'</table>':empty('Sem dados','')}</div></div>
<div class="card" style="margin-top:12px"><div class="k">Alertas</div>${al.length?'<ul style="margin:8px 0 0;padding-left:18px">'+al.join('')+'</ul>':'<div class="empty">Nenhum alerta no momento.</div>'}</div>`}
function prods(){const t=q.toLowerCase(),L=S.products.filter(p=>!t||p.name.toLowerCase().includes(t)||p.sku.toLowerCase().includes(t));
return`<h1>Produtos</h1><p class="sub">${S.products.length} cadastrados</p><div class="bar"><input id="q" placeholder="Buscar por nome ou SKU" value="${esc(q)}" style="max-width:320px" aria-label="Buscar"><span class="sp"></span><button class="b p" data-a="pf">Novo produto</button></div>
<div class="card tw">${L.length?`<table><tr><th>Produto</th><th class="r">Custo</th><th class="r">Preço</th><th class="r">Margem</th><th class="r">Estoque</th><th>Status</th><th></th></tr>${L.map(p=>{const m=p.price?(p.price-p.cost)/p.price*100:null;return`<tr><td class="w"><b>${esc(p.name)}</b><br><span class="k">${esc(p.sku)}</span></td><td class="r">${fmt(p.cost)}</td><td class="r">${fmt(p.price)}</td><td class="r ${p.price<p.cost?'neg':''}">${pc(m)}</td><td class="r">${p.stock}${p.stock<=0?' <span class="bd x">zerado</span>':p.stock<=p.min?' <span class="bd a">baixo</span>':''}</td><td>${p.active?'<span class="bd g">Ativo</span>':'<span class="bd">Inativo</span>'}</td><td class="r"><button class="b s" data-a="adj" data-id="${p.id}">Estoque</button> <button class="b s" data-a="pf" data-id="${p.id}">Editar</button> <button class="b s" data-a="tog" data-id="${p.id}">${p.active?'Inativar':'Ativar'}</button></td></tr>`}).join('')}</table>`:empty(S.products.length?'Nada encontrado':'Nenhum produto ainda','Cadastre seu primeiro produto para começar.',S.products.length?'':'<button class="b p" data-a="pf">Novo produto</button>')}</div>`}
function cartHTML(){let r=null,e='';try{r=cart.length?calc(cart.map(c=>({qty:c.qty,price:c.price,cost:prod(c.pid).cost,disc:c.disc})),mv(cf.gd),mv(cf.fees),mv(cf.ship)):null}catch(x){e=x.message}
const o=(v,l)=>`<option value="${v}"${cf.m===v?' selected':''}>${l}</option>`;
return`<div class="card"><div class="k" style="margin-bottom:8px">Carrinho</div>${cart.length?`<div class="tw"><table>${cart.map((c,i)=>`<tr><td class="w">${esc(prod(c.pid).name)}<br><span class="k">${fmt(c.price)}</span></td><td style="width:70px"><input type="number" min="1" step="1" value="${c.qty}" data-c="qty" data-i="${i}" aria-label="Quantidade"></td><td style="width:90px"><input value="${c.disc?(c.disc/100).toFixed(2).replace('.',','):''}" placeholder="Desc." data-c="disc" data-i="${i}" aria-label="Desconto do item"></td><td><button class="b s r" data-a="rm" data-i="${i}" aria-label="Remover">×</button></td></tr>`).join('')}</table></div>
<div class="fr" style="margin-top:10px"><div class="f"><label for="gd">Desconto geral (R$)</label><input id="gd" data-c="gd" value="${esc(cf.gd)}" inputmode="decimal"></div><div class="f"><label for="pm">Pagamento</label><select id="pm" data-c="m">${o('pix','Pix')}${o('cash','Dinheiro')}${o('debit','Débito')}${o('credit','Crédito')}${o('other','Outro')}${o('rec','A receber')}</select></div>
<div class="f"><label for="fe">Taxas (custo da loja)</label><input id="fe" data-c="fees" value="${esc(cf.fees)}" inputmode="decimal"></div><div class="f"><label for="sh">Frete (custo da loja)</label><input id="sh" data-c="ship" value="${esc(cf.ship)}" inputmode="decimal"></div></div>
${r?`<div class="ln"><span>Subtotal</span><span>${fmt(r.gross)}</span></div><div class="ln"><span>Descontos</span><span>− ${fmt(r.gross-r.net)}</span></div><div class="ln t"><span>Total</span><span>${fmt(r.net)}</span></div><div class="ln k"><span>Lucro bruto · margem</span><span>${fmt(r.gp)} · ${pc(r.gm)}</span></div><div class="ln k"><span>Lucro líquido est.</span><span>${fmt(r.np)}</span></div>`:''}
<div class="er" role="alert">${esc(e)}</div><button class="b p" style="width:100%" data-a="sell"${r?'':' disabled'}>Confirmar venda</button>`:empty('Carrinho vazio','Busque um produto ao lado e toque para adicionar.')}</div>`}
function resHTML(){const t=pq.toLowerCase(),L=S.products.filter(p=>p.active&&(!t||p.name.toLowerCase().includes(t)||p.sku.toLowerCase()===t||p.sku.toLowerCase().includes(t))).slice(0,30);
return L.length?'<table>'+L.map(p=>`<tr><td class="w"><b>${esc(p.name)}</b><br><span class="k">${esc(p.sku)} · saldo ${p.stock}</span></td><td class="r">${fmt(p.price)}</td><td class="r"><button class="b s p" data-a="add" data-id="${p.id}"${p.stock<=0?' disabled':''}>Adicionar</button></td></tr>`).join('')+'</table>':empty(S.products.length?'Nada encontrado':'Sem produtos','Cadastre produtos na aba Produtos.')}
function pdv(){return`<h1>Nova venda</h1><p class="sub">O estoque é conferido e baixado ao confirmar</p><div class="pdv"><div class="card"><input id="pq" placeholder="Nome ou SKU (Enter adiciona SKU exato)" value="${esc(pq)}" aria-label="Buscar produto" autofocus><div class="tw" id="res" style="margin-top:8px">${resHTML()}</div></div><div id="cart">${cartHTML()}</div></div>`}
function hist(){const L=[...S.sales].reverse();return`<h1>Vendas</h1><p class="sub">${S.sales.length} registradas</p><div class="card tw">${L.length?`<table><tr><th>Nº</th><th>Data</th><th class="r">Total</th><th class="r">Lucro bruto</th><th>Pagamento</th><th>Situação</th><th></th></tr>${L.map(s=>`<tr><td>#${s.n}</td><td>${fd(s.date)}</td><td class="r">${fmt(s.net)}</td><td class="r">${fmt(s.gp)}</td><td>${PM[s.method]}</td><td>${s.status==='ok'?'<span class="bd g">Concluída</span>':'<span class="bd x">Cancelada</span>'}</td><td class="r"><button class="b s" data-a="sd" data-id="${s.id}">Detalhes</button></td></tr>`).join('')}</table>`:empty('Nenhuma venda ainda','As vendas confirmadas aparecem aqui.','<button class="b p" data-a="go" data-v="pdv">Nova venda</button>')}</div>`}
const PM={pix:'Pix',cash:'Dinheiro',debit:'Débito',credit:'Crédito',other:'Outro',rec:'A receber'};
function stock(){const L=[...S.moves].reverse().slice(0,150);return`<h1>Estoque</h1><p class="sub">Histórico auditável de movimentações</p><div class="bar"><span class="sp"></span><button class="b p" data-a="adj">Nova movimentação</button></div><div class="card tw">${L.length?`<table><tr><th>Data</th><th>Produto</th><th>Tipo</th><th class="r">Qtd.</th><th class="r">Saldo</th><th>Motivo</th></tr>${L.map(m=>`<tr><td>${fd(m.date)}</td><td class="w">${esc(prod(m.pid)?.name||'?')}</td><td>${TL[m.type]}</td><td class="r ${m.qty<0?'neg':'pos'}">${m.qty>0?'+':''}${m.qty}</td><td class="r">${m.before} → ${m.after}</td><td class="w">${esc(m.reason)}</td></tr>`).join('')}</table>`:empty('Sem movimentações','Entradas, vendas e ajustes aparecem aqui.')}</div>`}
const views={dash,prods,pdv,hist,stock};
const topbar=()=>`<div class="bar" style="margin-bottom:8px"><b>${esc(S.store)}</b><span class="sp"></span>${sb?`<span class="k" id="sy">${SYL[sync]||''}</span><span class="k">${esc(uemail)}</span>`:'<span class="k">Modo local (sem login)</span>'}<button class="b s" data-a="cfg">Configurações</button>${sb?'<button class="b s" data-a="out">Sair</button>':''}</div>`;
function r(){nav();$('#v').innerHTML='<div>'+topbar()+views[view]()+'</div>'}
function modal(h){const d=$('#dlg');d.innerHTML=h;if(!d.open)d.showModal()}const ferr=m=>{const e=$('#fe_');if(e)e.textContent=m;return 1};
function receipt(id){const s=S.sales.find(x=>x.id===id);modal(`<div class="rc"><div class="c"><b>${esc(S.store)}</b><br>Venda #${s.n} · ${fd(s.date)}<br>Comprovante sem valor fiscal</div><hr>${s.items.map(i=>`<div class="ln"><span>${i.qty}× ${esc(i.name)}</span><span>${fmt(i.net)}</span></div>`).join('')}<hr><div class="ln"><span>Descontos</span><span>${fmt(s.gross-s.net)}</span></div><div class="ln t"><span>TOTAL</span><span>${fmt(s.net)}</span></div><div class="ln"><span>${PM[s.method]}</span><span>${fmt(s.paid)}</span></div><div class="c"><br>Obrigado pela preferência!</div></div><div class="act"><button class="b" data-a="x">Fechar</button><button class="b p" data-a="print">Imprimir</button></div>`)}
const A={go(d){view=d.v;if(view==='pdv'){pq=''}r();scrollTo(0,0)},x(){$('#dlg').close()},print(){print()},
pf(d){const p=d.id?prod(d.id):{name:'',sku:'',cost:0,price:0,min:0};const m=c=>c?(c/100).toFixed(2).replace('.',','):'';modal(`<h2>${d.id?'Editar':'Novo'} produto</h2><div class="f"><label for="f_n">Nome</label><input id="f_n" value="${esc(p.name)}"></div><div class="fr"><div class="f"><label for="f_s">SKU</label><input id="f_s" value="${esc(p.sku)}"></div><div class="f"><label for="f_m">Estoque mínimo</label><input id="f_m" type="number" min="0" value="${p.min}"></div><div class="f"><label for="f_c">Custo (R$)</label><input id="f_c" inputmode="decimal" value="${m(p.cost)}"></div><div class="f"><label for="f_p">Preço de venda (R$)</label><input id="f_p" inputmode="decimal" value="${m(p.price)}"></div></div>${d.id?'':'<div class="f"><label for="f_i">Estoque inicial</label><input id="f_i" type="number" min="0" value="0"></div>'}<div class="er" id="fe_" role="alert"></div><div class="act"><button class="b" data-a="x">Cancelar</button><button class="b p" data-a="ps" data-id="${d.id||''}">Salvar</button></div>`)},
ps(d){const g=i=>$('#'+i).value.trim(),name=g('f_n'),sku=g('f_s'),cost=toC(g('f_c')||'0'),price=toC(g('f_p')||'0'),min=Number(g('f_m')||0),ini=d.id?0:Number(g('f_i')||0);
if(!name)return ferr('Informe o nome');if(!sku)return ferr('Informe o SKU');if(isNaN(cost)||cost<0||isNaN(price)||price<0)return ferr('Custo e preço devem ser valores válidos');if(!(min>=0)||!(ini>=0)||!Number.isInteger(min)||!Number.isInteger(ini))return ferr('Quantidades devem ser inteiros não negativos');
if(S.products.some(p=>p.sku.toLowerCase()===sku.toLowerCase()&&p.id!==d.id))return ferr('Já existe produto com este SKU');
if(d.id)Object.assign(prod(d.id),{name,sku,cost,price,min});else{const p={id:uid(),name,sku,cost,price,min,stock:0,active:true};S.products.push(p);if(ini>0)move(p,'in',ini,'Saldo inicial')}
save();A.x();r();toast('Produto salvo')},
tog(d){const p=prod(d.id);p.active=!p.active;save();r()},
adj(d){modal(`<h2>Movimentação de estoque</h2><div class="f"><label for="a_p">Produto</label><select id="a_p">${S.products.map(p=>`<option value="${p.id}"${p.id===d.id?' selected':''}>${esc(p.name)} (saldo ${p.stock})</option>`).join('')}</select></div><div class="fr"><div class="f"><label for="a_t">Tipo</label><select id="a_t"><option value="in">Entrada</option><option value="out">Saída (ajuste)</option><option value="loss">Perda / avaria</option></select></div><div class="f"><label for="a_q">Quantidade</label><input id="a_q" type="number" min="1" step="1" value="1"></div></div><div class="f"><label for="a_r">Motivo (obrigatório em saída e perda)</label><input id="a_r"></div><div class="er" id="fe_" role="alert"></div><div class="act"><button class="b" data-a="x">Cancelar</button><button class="b p" data-a="as">Registrar</button></div>`)},
as(){const p=prod($('#a_p').value),t=$('#a_t').value,n=Number($('#a_q').value),rs=$('#a_r').value.trim();if(!p)return ferr('Cadastre um produto primeiro');if(!Number.isInteger(n)||n<=0)return ferr('Quantidade inválida');if(t!=='in'&&rs.length<3)return ferr('Informe o motivo');
try{move(p,t,t==='in'?n:-n,rs||'Entrada manual')}catch(e){return ferr(e.message)}save();A.x();r();toast('Movimentação registrada')},
add(d){const p=prod(d.id),c=cart.find(x=>x.pid===p.id);if(c){if(c.qty+1>p.stock)return toast('Saldo insuficiente');c.qty++}else cart.push({pid:p.id,qty:1,price:p.price,disc:0});$('#cart').innerHTML=cartHTML()},
rm(d){cart.splice(+d.i,1);$('#cart').innerHTML=cartHTML()},
sell(){const e=$('#cart .er');try{if(!cart.length)throw Error('Carrinho vazio');const dup=S.sales.find(s=>s.key===ckey);if(dup){receipt(dup.id);return}
const need={};cart.forEach(c=>need[c.pid]=(need[c.pid]||0)+c.qty);for(const id in need){const p=prod(id);if(!p||!p.active)throw Error('Produto indisponível');if(p.stock<need[id])throw Error('Estoque insuficiente: '+p.name+' (saldo '+p.stock+')')}
const r=calc(cart.map(c=>({qty:c.qty,price:prod(c.pid).price,cost:prod(c.pid).cost,disc:c.disc})),mv(cf.gd),mv(cf.fees),mv(cf.ship));
const s={id:uid(),key:ckey,n:S.seq++,date:new Date().toISOString(),method:cf.m,status:'ok',gross:r.gross,net:r.net,cogs:r.cogs,gp:r.gp,np:r.np,fees:mv(cf.fees),ship:mv(cf.ship),paid:cf.m==='rec'?0:r.net,
items:cart.map((c,i)=>{const p=prod(c.pid),l=r.lines[i];return{pid:p.id,name:p.name,sku:p.sku,qty:c.qty,price:prod(c.pid).price,cost:p.cost,disc:c.disc,alloc:l.a,net:l.net}})};
s.items.forEach(i=>move(prod(i.pid),'sale',-i.qty,'Venda #'+s.n,s.id));S.sales.push(s);save();cart=[];cf={gd:'',fees:'',ship:'',m:'pix'};ckey=uid();r_();receipt(s.id)}catch(x){e.textContent=x.message}},
sd(d){const s=S.sales.find(x=>x.id===d.id);modal(`<h2>Venda #${s.n}</h2><div class="k">${fd(s.date)} · ${PM[s.method]} · ${s.status==='ok'?'Concluída':'Cancelada'}</div><div class="tw"><table>${s.items.map(i=>`<tr><td class="w">${i.qty}× ${esc(i.name)}</td><td class="r">${fmt(i.net)}</td><td class="r k">custo ${fmt(rnd(i.qty*i.cost))}</td></tr>`).join('')}</table></div><div class="ln t"><span>Total</span><span>${fmt(s.net)}</span></div><div class="ln"><span>Custo dos produtos</span><span>${fmt(s.cogs)}</span></div><div class="ln"><span>Lucro bruto · margem</span><span>${fmt(s.gp)} · ${pc(s.net?s.gp/s.net*100:null)}</span></div><div class="ln"><span>Lucro líquido estimado</span><span>${fmt(s.np)}</span></div>${s.reason?`<div class="k">Motivo do cancelamento: ${esc(s.reason)}</div>`:''}<div class="act"><button class="b" data-a="x">Fechar</button><button class="b" data-a="rc" data-id="${s.id}">Comprovante</button>${s.status==='ok'?`<button class="b r" data-a="cf" data-id="${s.id}">Cancelar venda</button>`:''}</div>`)},
rc(d){receipt(d.id)},
cf(d){modal(`<h2>Cancelar venda</h2><p>A venda é preservada e o estoque volta com movimentações de estorno.</p><div class="f"><label for="c_r">Motivo (obrigatório)</label><input id="c_r"></div><div class="er" id="fe_" role="alert"></div><div class="act"><button class="b" data-a="x">Voltar</button><button class="b r" data-a="cx" data-id="${d.id}">Confirmar cancelamento</button></div>`)},
cx(d){const s=S.sales.find(x=>x.id===d.id),rs=$('#c_r').value.trim();if(s.status!=='ok')return ferr('Venda já cancelada');if(rs.length<3)return ferr('Informe o motivo');s.items.forEach(i=>move(prod(i.pid),'reversal',i.qty,'Cancelamento #'+s.n+': '+rs,s.id));s.status='cancelled';s.reason=rs;s.paid=0;save();A.x();r();toast('Venda cancelada')},
cfg(){modal(`<h2>Configurações</h2><div class="f"><label for="s_n">Nome da loja</label><input id="s_n" value="${esc(S.store)}"></div><div class="f"><label for="s_t">Tema</label><select id="s_t"><option value="">Automático</option><option value="light">Claro</option><option value="dark">Escuro</option></select></div><p class="k">Os dados ficam salvos somente neste navegador. Limpar os dados do site apaga tudo.</p><div class="act"><button class="b r" data-a="rs">Apagar todos os dados</button><button class="b p" data-a="cs">Salvar</button></div>`);try{$('#s_t').value=localStorage.getItem('nexo.theme')||''}catch(e){}},
cs(){S.store=$('#s_n').value.trim()||'Minha Loja';const t=$('#s_t').value;if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;try{t?localStorage.setItem('nexo.theme',t):localStorage.removeItem('nexo.theme')}catch(e){}save();A.x();r()},
rs(){modal(`<h2>Apagar tudo?</h2><p>Produtos, estoque e vendas serão apagados permanentemente.</p><div class="act"><button class="b" data-a="x">Voltar</button><button class="b r" data-a="rs2">Apagar definitivamente</button></div>`)},
rs2(){S={store:S.store,products:[],moves:[],sales:[],seq:1};cart=[];save();A.x();r()}};
function r_(){r()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset)});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;const p=e.target.selectionStart;r();const n=$('#q');n.focus();n.setSelectionRange(p,p)}if(e.target.id==='pq'){pq=e.target.value;$('#res').innerHTML=resHTML()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='per'){period=+t.value;r();return}const k=t.dataset.c;if(!k)return;
if(k==='qty'||k==='disc'){const c=cart[+t.dataset.i],p=prod(c.pid);if(k==='qty'){const n=Math.floor(Number(t.value));if(!(n>=1)||n>p.stock){toast('Quantidade inválida ou acima do saldo ('+p.stock+')');}else c.qty=n}else{const v=toC(t.value||'0');if(isNaN(v)||v<0)toast('Desconto inválido');else c.disc=v}}else cf[k]=t.value;$('#cart').innerHTML=cartHTML()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pq'){const t=e.target.value.trim().toLowerCase(),p=S.products.find(p=>p.active&&p.sku.toLowerCase()===t);if(p&&p.stock>0){A.add({id:p.id});e.target.value='';pq='';$('#res').innerHTML=resHTML()}}});
Object.assign(A,{
async li(){const em=$('#au_e').value.trim(),pw=$('#au_p').value;if(!em||!pw)return amsg('Informe e-mail e senha');amsg('Entrando…',1);const{data,error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)return amsg(tr(error.message));await enter(data.session)},
async su(){const em=$('#au_e').value.trim(),pw=$('#au_p').value;if(!em||pw.length<6)return amsg('Informe e-mail e uma senha de 6+ caracteres');amsg('Criando conta…',1);const{data,error}=await sb.auth.signUp({email:em,password:pw});if(error)return amsg(tr(error.message));if(data.session)await enter(data.session);else amsg('Conta criada! Confirme o e-mail que enviamos e depois entre.',1)},
async fp(){const em=$('#au_e').value.trim();if(!em)return amsg('Digite seu e-mail acima');const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});if(error)return amsg(tr(error.message));amsg('Se o e-mail existir, enviamos o link para redefinir a senha.',1)},
async np(){const pw=$('#au_p').value;if(pw.length<6)return amsg('A senha precisa ter ao menos 6 caracteres');const{error}=await sb.auth.updateUser({password:pw});if(error)return amsg(tr(error.message));recovery=false;history.replaceState(null,'',location.pathname);const{data:{session}}=await sb.auth.getSession();if(session)await enter(session);else showAuth()},
async out(){clearTimeout(timer);if(sync==='pend')await push();await sb.auth.signOut()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='au_p'&&sb)(recovery?A.np:A.li)()});
document.addEventListener('visibilitychange',async()=>{if(!sb||!uidU||document.hidden||saving||sync==='pend')return;try{const{data}=await sb.from('store_data').select('version').eq('user_id',uidU).maybeSingle();if(data&&data.version>ver){await loadCloud();r();toast('Dados atualizados de outro dispositivo')}}catch(e){}});
boot();
</script></body></html>
